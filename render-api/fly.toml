# Fly.io config para bolsillo-ia-relay
# Despliegue desde local SIN Git/GitHub:
#   1) winget install Fly.flyctl   (o: iwr https://fly.io/install.ps1 -useb | iex)
#   2) flyctl auth signup          (solo email, no pide repo)
#   3) cd render-api && flyctl launch --no-deploy --copy-config --name bolsillo-ia-<aleatorio>
#   4) flyctl deploy
# La carpeta local se sube comprimida al builder de Fly. Nada pasa por GitHub.

app = "bolsillo-ia-relay"
primary_region = "mad"   # Madrid; cambia a "lhr", "ams", "iad" si prefieres

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"      # se duerme si no hay tráfico (ahorra)
  auto_start_machines = true       # despierta al primer request
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
